[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowguard-terrain"
version = "0.1.0"
description = "SnowGuard terrain layer: solar geometry, DEM horizon angles and the offline route database"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "rasterio>=1.3",
    "requests",
    "matplotlib",
]

[project.optional-dependencies]
validate = ["pvlib>=0.10", "pandas"]

[project.scripts]
snowguard-build-route = "snowguard_terrain.build_db:main"
snowguard-validate-solar = "snowguard_terrain.validate_solar:main"
snowguard-ablation = "snowguard_terrain.ablation:main"

[tool.setuptools.packages.find]
include = ["snowguard_terrain*"]
